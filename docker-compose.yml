services:
  postgres:
    image: postgres:16-alpine
    container_name: estimating-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: estimating
      POSTGRES_USER: estimating
      POSTGRES_PASSWORD: estimating_dev_only
    ports:
      - "5432:5432"
    volumes:
      - estimating-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimating -d estimating"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  estimating-postgres-data:
